apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-agent-app
  namespace: email-agent
  labels:
    app: email-agent
    component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-agent
      component: app
  template:
    metadata:
      labels:
        app: email-agent
        component: app
    spec:
      containers:
      - name: app
        image: email-agent:latest  # 실제 이미지로 변경 필요
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: email-agent-config
        - secretRef:
            name: email-agent-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
      volumes:
      - name: app-logs
        emptyDir: {}
      restartPolicy: Always

