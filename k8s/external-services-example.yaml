# 외부 서비스 예시
# MySQL, Redis, Qdrant, MinIO를 클러스터 내부에 배포하는 경우 사용

---
# MySQL StatefulSet 예시
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: email-agent
spec:
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-agent-secrets
              key: DB_PASSWORD
        - name: MYSQL_DATABASE
          value: "email_agent"
        - name: MYSQL_USER
          value: "email_agent"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-agent-secrets
              key: DB_PASSWORD
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: email-agent
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306

---
# Redis Deployment 예시
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: email-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: email-agent
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
# Qdrant Deployment 예시
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: email-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
        - containerPort: 6334
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: qdrant-data
        emptyDir: {}  # 실제 운영에서는 PersistentVolume 사용 권장

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: email-agent
spec:
  selector:
    app: qdrant
  ports:
  - port: 6333
    targetPort: 6333
  - port: 6334
    targetPort: 6334

---
# MinIO Deployment 예시
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: email-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: email-agent-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-agent-secrets
              key: MINIO_SECRET_KEY
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: minio-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: minio-data
        emptyDir: {}  # 실제 운영에서는 PersistentVolume 사용 권장

---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: email-agent
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000
  - port: 9001
    targetPort: 9001

