# Celery Beat 스케줄 파일을 위한 PersistentVolume
# 실제 운영 환경에서는 이 파일을 사용하여 스케줄 데이터를 영구 저장
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: email-agent-beat-pvc
  namespace: email-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard  # 클러스터의 StorageClass에 맞게 수정

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-agent-beat
  namespace: email-agent
  labels:
    app: email-agent
    component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-agent
      component: beat
  template:
    metadata:
      labels:
        app: email-agent
        component: beat
    spec:
      containers:
      - name: beat
        image: email-agent-beat:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: email-agent-config
        - secretRef:
            name: email-agent-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: beat-schedule
          mountPath: /app
      volumes:
      - name: beat-schedule
        persistentVolumeClaim:
          claimName: email-agent-beat-pvc
      restartPolicy: Always

